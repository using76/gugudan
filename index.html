:root{
  /* layout: one 깍두기-notebook page (max 480px) — top bar, pencil timer, problem, answer cells, 4×3 keypad with 확인 at bottom-right */
  --paper:#FBFBF4;
  --grid:#DCEBE3;
  --ink:#1D2742;
  --ink-soft:#5E6780;
  --redpen:#E0352B;
  --pencil:#F5C431;
  --key:#FFFFFF;
  --desk:#26304B;
  --display:"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --pen:"Nanum Pen Script","Jua","Malgun Gothic",cursive;
  --body:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --cell:28px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--redpen);outline-offset:2px}
[hidden]{display:none !important}

#app{
  position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);background-position:center -1px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
@media (min-width:560px){
  body{background:var(--desk)}
  #app{height:calc(100% - 32px);margin:16px auto;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
}
.screen{height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 18px 18px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.grow{flex:1}
.nm{font-family:var(--body);font-weight:800}

/* shared controls */
.topbar{display:flex;align-items:center;gap:10px;min-height:46px}
.topbar h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.icon-btn{
  flex:none;width:46px;height:46px;border-radius:13px;border:2px solid var(--ink);background:var(--key);
  display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:24px;height:24px}
.snd .ic-off{display:none}
.snd[data-muted="true"] .ic-on{display:none}
.snd[data-muted="true"] .ic-off{display:block}
.btn{
  min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--key);
  font-family:var(--display);font-size:22px;padding:0 18px;box-shadow:0 4px 0 var(--ink);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--redpen);color:#fff}
.label{font-family:var(--display);font-size:19px;margin:0 0 8px}
.hint{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5}
.chip{
  border:2px solid var(--ink);background:var(--key);border-radius:999px;padding:6px 14px;
  font-family:var(--display);font-size:17px;min-height:38px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* home */
.brand{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.brand h1{
  margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;letter-spacing:-.01em;
}
.brand h1 .hl{background:linear-gradient(transparent 58%,rgba(245,196,49,.75) 58% 92%,transparent 92%);padding:0 2px}
.brand .sub{font-family:var(--pen);color:var(--redpen);font-size:27px;margin:0;line-height:1}
.field{display:flex;flex-direction:column}
.nick-input{
  height:56px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0 16px;
  font-family:var(--body);font-weight:800;font-size:21px;color:var(--ink);width:100%;
}
.nick-input::placeholder{color:#A3AABB;font-weight:600}
.nick-input.bad{border-color:var(--redpen);animation:shake .35s}
.err{color:var(--redpen);font-family:var(--pen);font-size:22px;min-height:0;margin:4px 0 0;line-height:1}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recent .chip{font-family:var(--body);font-weight:800;font-size:15px}
.dan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{
  height:58px;border-radius:14px;border:2px solid var(--ink);background:var(--key);box-shadow:0 3px 0 var(--ink);
  font-family:var(--display);font-size:25px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.choice small{font-size:14px;color:var(--ink-soft)}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.choice[aria-pressed="true"] small{color:#C9CFDE}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.time-row{display:flex;align-items:center;gap:12px}
.time-out{
  flex:1;text-align:center;font-family:var(--display);font-size:30px;height:56px;line-height:52px;
  border:2px dashed var(--ink-soft);border-radius:14px;background:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.best{
  margin:0;padding:10px 14px;border-left:4px solid var(--pencil);background:rgba(255,255,255,.8);
  font-size:15px;line-height:1.45;border-radius:0 10px 10px 0;
}
.home-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:2px}
.home-actions .btn.primary{font-size:26px;min-height:62px}

/* game */
#game{gap:10px}
.g-top{display:flex;align-items:center;gap:8px}
.g-who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.g-who .nm{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{
  flex:none;font-family:var(--display);font-size:16px;border:2px solid var(--ink);border-radius:8px;
  padding:2px 8px;background:var(--pencil);
}
.score{display:flex;gap:10px;font-family:var(--display);font-size:16px;align-items:baseline;flex:none}
.score b{font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.score .ok b{color:var(--ink)}
.score .no{color:var(--ink-soft)}
.timer{display:flex;align-items:center;gap:12px;height:34px}
.pencil-track{flex:1;height:26px;position:relative}
.pencil{
  position:absolute;left:0;top:0;bottom:0;display:flex;min-width:64px;
  width:calc(var(--p,1) * 100%);filter:drop-shadow(0 2px 0 rgba(29,39,66,.22));
}
.pencil .eraser{width:16px;background:#F29BB0;border:2px solid var(--ink);border-right:0;border-radius:7px 0 0 7px}
.pencil .band{width:10px;background:repeating-linear-gradient(90deg,#AEB6C2 0 2px,#E4E8EE 2px 4px);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.pencil .body{flex:1;background:linear-gradient(#FADB6A 0 34%,var(--pencil) 34% 67%,#E3AE1C 67%);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.pencil .tip{width:28px;height:100%;flex:none;margin-left:-1px}
.time-text{
  min-width:70px;text-align:right;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;
}
#game.hurry .time-text{color:var(--redpen)}
#game.hurry .pencil{animation:wobble .5s ease-in-out infinite}
.problem{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,2vh,18px);gap:clamp(6px,2dvh,18px);
}
.q{
  font-family:var(--display);line-height:1;display:flex;align-items:baseline;gap:.22em;
  font-size:clamp(52px,10vh,96px);font-size:clamp(52px,10dvh,96px);font-variant-numeric:tabular-nums;
}
.q .op{color:var(--ink-soft);font-size:.8em}
.q.new{animation:rise .22s ease-out}
.ans-wrap{position:relative;display:flex;justify-content:center;--c:clamp(60px,9.4vh,86px);--c:clamp(60px,9.4dvh,86px)}
.cells{display:flex}
.cell{
  width:var(--c);height:var(--c);background:#fff;border:2px solid var(--ink);
  display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--c) * .72);line-height:1;
  background-image:linear-gradient(var(--grid),var(--grid)),linear-gradient(var(--grid),var(--grid));
  background-size:100% 1px,1px 100%;background-position:center,center;background-repeat:no-repeat;
}
.cell+.cell{border-left-width:0}
.cell:first-child{border-radius:10px 0 0 10px}
.cell:last-child{border-radius:0 10px 10px 0}
.cells.live .cell.cur::after{content:"";width:3px;height:52%;background:var(--redpen);animation:blink 1s steps(1) infinite}
.cells.shake{animation:shake .3s}
.mark{position:absolute;left:50%;top:50%;width:calc(var(--c) * 2 + 96px);height:calc(var(--c) + 58px);transform:translate(-50%,-50%);pointer-events:none;overflow:visible}
.mark path{fill:none;stroke:var(--redpen);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.mark[data-kind="ok"] .p-ok,.mark[data-kind="no"] .p-no{opacity:.92}
.mark.on[data-kind="ok"] .p-ok{animation:draw .18s ease-out forwards}
.mark.on[data-kind="no"] .p-no{animation:draw .16s ease-out forwards}
.fb{font-family:var(--pen);color:var(--redpen);font-size:clamp(26px,4.4vh,38px);font-size:clamp(26px,4.4dvh,38px);line-height:1;min-height:1em;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{
  height:clamp(52px,8.4vh,76px);height:clamp(52px,8.4dvh,76px);
  border-radius:16px;border:2px solid var(--ink);background:var(--key);box-shadow:0 4px 0 var(--ink);
  font-family:var(--display);font-size:clamp(28px,4.4vh,38px);font-size:clamp(28px,4.4dvh,38px);
  display:grid;place-items:center;padding:0;user-select:none;-webkit-user-select:none;
}
.key svg{width:34px;height:34px}
.key.del{background:#EEF2EF}
.key.ok{background:var(--redpen);color:#fff;font-size:clamp(24px,3.6vh,32px);font-size:clamp(24px,3.6dvh,32px)}
.key:active,.key.pressed{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* overlay + modal */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(251,251,244,.9)}
.ov-text{font-family:var(--display);font-size:128px;line-height:1;color:var(--ink)}
.ov-text.go{color:var(--redpen);font-size:96px}
.ov-text.end{font-size:72px;color:var(--redpen)}
.ov-text.pop{animation:pop .6s ease-out}
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(29,39,66,.45)}
.sheet{
  width:100%;max-width:360px;background:var(--paper);border:2px solid var(--ink);border-radius:18px;
  padding:22px 20px 18px;box-shadow:0 6px 0 var(--ink);
}
.sheet h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:24px}
.sheet p{margin:0 0 18px;line-height:1.55;color:var(--ink-soft)}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* result */
.card{
  position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px 18px 18px;
  box-shadow:0 5px 0 var(--ink);
}
.r-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:92px}
.r-who .nm{font-size:22px}
.r-big{display:flex;align-items:baseline;gap:6px;margin:14px 0 6px;font-family:var(--display)}
.r-big b{font-weight:400;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums}
.r-big span{font-size:22px}
.r-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.r-stats div{border-top:2px solid var(--grid);padding-top:8px}
.r-stats dt{font-size:13px;color:var(--ink-soft)}
.r-stats dd{margin:2px 0 0;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.r-note{font-family:var(--pen);color:var(--redpen);font-size:28px;margin:12px 0 0;line-height:1.15;white-space:pre-line}
.stamp{
  position:absolute;top:-16px;right:-8px;width:96px;height:96px;background:rgba(255,255,255,.55);border-radius:50%;
  border:4px solid var(--redpen);display:grid;place-items:center;transform:rotate(-14deg);
  color:var(--redpen);text-align:center;font-family:var(--display);font-size:21px;line-height:1.05;
  box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--redpen);opacity:.9;
}
.stamp.in{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.stamp.small-text{font-size:18px}
.wrong h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:19px}
.wrong ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.wrong li{
  background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-family:var(--display);font-size:20px;
  font-variant-numeric:tabular-nums;
}
.wrong li small{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px}
.wrong .pen-note{font-family:var(--pen);color:var(--redpen);font-size:26px;margin:0}
.actions3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.actions3 .btn.primary{grid-column:1 / -1;font-size:26px;min-height:62px}

/* rank */
.conds{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;flex:none;scrollbar-width:none}
.conds .chip{flex:none;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;flex:none}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
.board{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:#fff;
  border:2px solid var(--ink);border-radius:14px;padding:8px 12px;
}
.row.me{background:linear-gradient(rgba(245,196,49,.38),rgba(245,196,49,.38)),#fff}
.medal{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;
  border:2px solid var(--ink);background:var(--paper);
}
.medal.m1{background:var(--pencil)}
.medal.m2{background:#D3D9E2}
.medal.m3{background:#E9B48A}
.row .who{min-width:0}
.row .who .nm{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{font-size:12px;color:var(--ink-soft)}
.row .pts{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.row .pts span{font-size:15px;margin-left:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.empty p{font-family:var(--pen);font-size:30px;color:var(--redpen);margin:0;line-height:1.1}
.rank-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.link-btn{background:none;border:0;padding:8px 0;color:var(--redpen);text-decoration:underline;font-size:14px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1.7);opacity:0}45%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
@keyframes wobble{50%{transform:translateX(-2px)}}
@keyframes stamp{0%{transform:rotate(-14deg) scale(2.2);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .mark path{stroke-dashoffset:0}
}
@media (max-height:640px){
  .brand h1{font-size:34px}
  .choice{height:50px}
  .screen{gap:10px}
}
</style>
</head>
<body>
<div id="app">

  <!-- 시작 화면 -->
  <section class="screen scroll" id="home">
    <div class="topbar">
      <div class="brand grow">
        <h1><span class="hl">구구단</span> 챌린지</h1>

      </div>

        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>

        <button class="choice" type="button" data-v="5">5단</button>
        <button class="choice" type="button" data-v="6">6단</button>
        <button class="choice" type="button" data-v="7">7단</button>
        <button class="choice" type="button" data-v="8">8단</button>

    <div class="field">
      <div class="label" id="timeLabel">게임 시간</div>
      <div class="time-row" aria-labelledby="timeLabel">
        <button class="icon-btn" type="button" id="tMinus" aria-label="10초 줄이기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <output class="time-out" id="timeOut" aria-live="polite">1분</output>
        <button class="icon-btn" type="button" id="tPlus" aria-label="10초 늘리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
        </button>
      </div>
      <div class="chips" id="timeChips">
        <button class="chip" type="button" data-t="30">30초</button>
        <button class="chip" type="button" data-t="60">1분</button>
        <button class="chip" type="button" data-t="120">2분</button>
        <button class="chip" type="button" data-t="180">3분</button>
        <button class="chip" type="button" data-t="300">5분</button>
      </div>
    </div>

    <p class="best" id="homeBest"></p>

    <div class="home-actions">
      <button class="btn" type="button" id="toRank">순위 보기</button>
      <button class="btn primary" type="button" id="startBtn">시작하기</button>
    </div>
    <button class="btn" type="button" id="installBtn" hidden>이 기기에 앱으로 설치하기</button>
    <p class="hint">PC에서는 키보드 숫자, Enter(확인), Backspace(지우기)로도 할 수 있어요. 순위 기록은 이 기기에 저장돼요.</p>
  </section>

  <!-- 게임 화면 -->
  <section class="screen" id="game" hidden>
    <div class="g-top">
      <div class="g-who"><span class="tag" id="gMode">7단</span><span class="nm" id="gNick"></span></div>
      <div class="score" aria-live="polite">
        <span class="ok">맞힘 <b id="cOk">0</b></span>
        <span class="no">틀림 <b id="cNo">0</b></span>
      </div>
      <button class="icon-btn snd" type="button" aria-label="소리 끄기" data-muted="false">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" type="button" id="exitBtn" aria-label="게임 그만하기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="timer" aria-label="남은 시간">
      <div class="pencil-track">
        <div class="pencil" id="pencil">
          <span class="eraser"></span><span class="band"></span><span class="body"></span>
          <svg class="tip" viewBox="0 0 28 26" preserveAspectRatio="none"><path d="M0 1 L27 13 L0 25 Z" fill="#F1D3A3" stroke="#1D2742" stroke-width="2" stroke-linejoin="round"/><path d="M18 9 L27 13 L18 17 Z" fill="#1D2742"/></svg>
        </div>
      </div>
      <div class="time-text" id="timeText">1:00</div>
    </div>

    <div class="problem">
      <div class="q" id="q" aria-live="polite"><span id="qa">?</span><span class="op">×</span><span id="qb">?</span><span class="op">=</span></div>
      <div class="ans-wrap">
        <div class="cells" id="cells" role="status" aria-label="내 답">
          <span class="cell"></span><span class="cell"></span>
        </div>
        <svg class="mark" id="mark" viewBox="0 0 220 130" aria-hidden="true">
          <path class="p-ok" pathLength="1" d="M70 22 C120 4 190 10 206 52 C220 92 160 124 100 120 C40 116 6 92 14 58 C20 34 52 18 96 14"/>
          <path class="p-no" pathLength="1" d="M168 10 L52 122"/>
        </svg>
      </div>
      <div class="fb" id="fb" aria-live="assertive"></div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" type="button" data-k="1">1</button>
      <button class="key" type="button" data-k="2">2</button>
      <button class="key" type="button" data-k="3">3</button>
      <button class="key" type="button" data-k="4">4</button>
      <button class="key" type="button" data-k="5">5</button>
      <button class="key" type="button" data-k="6">6</button>
      <button class="key" type="button" data-k="7">7</button>
      <button class="key" type="button" data-k="8">8</button>
      <button class="key" type="button" data-k="9">9</button>
      <button class="key del" type="button" data-k="back" aria-label="지우기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
      </button>
      <button class="key" type="button" data-k="0">0</button>
      <button class="key ok" type="button" data-k="ok">확인</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section class="screen scroll" id="result" hidden>
    <div class="topbar">
      <h2 class="grow">결과</h2>
      <button class="icon-btn snd" type="button" aria-label="소리 끄기" data-muted="false">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div class="card">
      <div class="stamp" id="rStamp"><span id="rStampText">참 잘했어요</span></div>
      <div class="r-who"><span class="nm" id="rNick"></span><span class="tag" id="rCond"></span></div>
      <div class="r-big"><b id="rOk">0</b><span>개 맞혔어요</span></div>
      <dl class="r-stats">
        <div><dt>틀림</dt><dd id="rNo">0</dd></div>
        <div><dt>정확도</dt><dd id="rAcc">0%</dd></div>
        <div><dt>순위</dt><dd id="rRank">-</dd></div>
      </dl>
      <p class="r-note" id="rNote"></p>
    </div>
    <div class="wrong" id="rWrongWrap">
      <h3>틀린 문제 다시 보기</h3>
      <ul id="rWrong"></ul>
    </div>
    <div class="actions3">
      <button class="btn primary" type="button" id="againBtn">다시 하기</button>
      <button class="btn" type="button" id="homeBtn">처음으로</button>
      <button class="btn" type="button" id="rankBtn2">순위 보기</button>
    </div>
  </section>

  <!-- 순위 화면 -->
  <section class="screen" id="rank" hidden>
    <div class="topbar">
      <button class="icon-btn" type="button" id="rankBack" aria-label="뒤로 가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 class="grow">순위표</h2>
    </div>
    <div class="conds" id="conds"></div>
    <label class="toggle" for="bestOnly"><input type="checkbox" id="bestOnly" checked> 닉네임마다 최고 기록만 보기</label>
    <ol class="board" id="board"></ol>
    <div class="rank-foot">
      <span class="hint">맞힌 개수가 같으면 덜 틀린 사람이 앞서요.</span>
      <button class="link-btn" type="button" id="clearBtn">기록 모두 지우기</button>
    </div>
  </section>

  <div class="overlay" id="overlay" hidden><div class="ov-text" id="ovText">3</div></div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet">
      <h3 id="mTitle"></h3>
      <p id="mText"></p>
      <div class="m-actions">
        <button class="btn" type="button" id="mNo"></button>
        <button class="btn primary" type="button" id="mYes"></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ---------- 저장소 (이 기기에만 저장) ---------- */
var store={
  ok:(function(){try{var k='__ggd_t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}})(),
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
var K_REC='ggd.records.v1',K_PREF='ggd.prefs.v1';
var DANS=[2,3,4,5,6,7,8,9];
var MAX_REC=3000;
var records=[],prefs={};

function clampTime(t){t=Math.round(Number(t)/10)*10;if(!isFinite(t))t=60;return Math.min(600,Math.max(10,t));}
function loadData(seed){
  var r=store.get(K_REC,null),p=store.get(K_PREF,null);
  if(!store.ok&&seed){r=seed.records;p=seed.prefs;}
  records=Array.isArray(r)?r.filter(function(x){return x&&typeof x.nick==='string'&&isFinite(x.ok)&&isFinite(x.no);}):[];
  prefs={nick:'',mode:'random',time:60,muted:false,recent:[],bestOnly:true,lastCond:null};
  if(p&&typeof p==='object'){for(var key in p){if(Object.prototype.hasOwnProperty.call(prefs,key))prefs[key]=p[key];}}
  if(!(prefs.mode==='random'||DANS.indexOf(prefs.mode)>=0))prefs.mode='random';
  prefs.time=clampTime(prefs.time);
  if(!Array.isArray(prefs.recent))prefs.recent=[];
}
function savePrefs(){store.set(K_PREF,prefs);}
function saveRecords(){store.set(K_REC,records);}

/* ---------- 표기 ---------- */
function modeLabel(m){return m==='random'?'랜덤':m+'단';}
function timeLabel(s){return s<60?s+'초':(s%60?Math.floor(s/60)+'분 '+(s%60)+'초':(s/60)+'분');}
function condKey(m,t){return m+'|'+t;}
function condOf(r){return condKey(r.mode,r.time);}
function parseCond(k){var a=k.split('|');return {mode:a[0]==='random'?'random':Number(a[0]),time:Number(a[1])};}
function condLabel(k){var c=parseCond(k);return modeLabel(c.mode)+' · '+timeLabel(c.time);}
function clock(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function nickEl(n){var s=document.createElement('span');s.className='nm';s.textContent=n;return s;}
function dateLabel(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

/* ---------- 순위 계산 ---------- */
function better(a,b){return (b.ok-a.ok)||(a.no-b.no)||(a.at-b.at);}
function board(k,bestOnly){
  var list=records.filter(function(r){return condOf(r)===k;}).sort(better);
  if(bestOnly){var seen={};list=list.filter(function(r){if(seen[r.nick])return false;seen[r.nick]=1;return true;});}
  return list;
}
function places(list){
  var out=[];
  list.forEach(function(r,i){
    var p=list[i-1];
    out.push(i>0&&p.ok===r.ok&&p.no===r.no?out[i-1]:i+1);
  });
  return out;
}

/* ---------- 소리 (딩동 / 삐) ---------- */
var ac=null,master=null;
function audio(){
  if(!ac){
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{ac=new C();master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);}catch(e){ac=null;return null;}
  }
  if(ac.state==='suspended'){try{var pr=ac.resume();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}}
  return ac;
}
function tone(c,type,f,t,dur,peak,dest){
  var o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05);
}
function bell(c,f,t,dur){
  tone(c,'sine',f,t,dur,0.34);
  tone(c,'sine',f*2,t,dur*0.45,0.08);
  tone(c,'triangle',f*3.01,t,dur*0.22,0.035);
}
var sfx={
  ding:function(){var c=audio();if(!c||prefs.muted)return;var t=c.currentTime+0.01;bell(c,783.99,t,0.75);bell(c,659.25,t+0.2,1.05);},
  beep:function(){
    var c=audio();if(!c||prefs.muted)return;var t=c.currentTime+0.01;
    var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(master);
    var o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(880,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.15,t+0.01);
    g.gain.setValueAtTime(0.15,t+0.36);g.gain.exponentialRampToValueAtTime(0.0001,t+0.44);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+0.48);
  },
  count:function(go){var c=audio();if(!c||prefs.muted)return;var t=c.currentTime+0.01;tone(c,'sine',go?1046.5:659.25,t,go?0.45:0.16,go?0.3:0.22);},
  tick:function(){var c=audio();if(!c||prefs.muted)return;var t=c.currentTime+0.005;tone(c,'triangle',1318.5,t,0.07,0.12);},
  end:function(){var c=audio();if(!c||prefs.muted)return;var t=c.currentTime+0.01;[783.99,659.25,523.25].forEach(function(f,i){tone(c,'triangle',f,t+i*0.16,i===2?0.6:0.2,0.25);});}
};
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

function renderSound(){
  $$('.snd').forEach(function(b){
    b.setAttribute('data-muted',prefs.muted?'true':'false');
    b.setAttribute('aria-label',prefs.muted?'소리 켜기':'소리 끄기');
  });
}

/* ---------- 화면 전환 ---------- */
var current='home',rankFrom='home';
function show(name){
  $$('.screen').forEach(function(s){s.hidden=s.id!==name;});
  current=name;
  var el=$('#'+name);if(el&&el.classList.contains('scroll'))el.scrollTop=0;
}

/* ---------- 시작 화면 ---------- */
function renderHome(){
  $('#nick').value=prefs.nick||'';
  $('#nickErr').textContent='';
  renderRecent();renderDan();renderTime();
}
function renderRecent(){
  var box=$('#recent');box.textContent='';
  prefs.recent.slice(0,6).forEach(function(n){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=n;
    b.setAttribute('aria-pressed',String(n===$('#nick').value.trim()));
    b.addEventListener('click',function(){$('#nick').value=n;$('#nickErr').textContent='';$('#nick').classList.remove('bad');renderRecent();});
    box.appendChild(b);
  });
}
function renderDan(){
  $$('#danGrid .choice').forEach(function(b){
    var v=b.getAttribute('data-v');v=v==='random'?'random':Number(v);
    b.setAttribute('aria-pressed',String(v===prefs.mode));
  });
  renderHomeBest();
}
function renderTime(){
  $('#timeOut').textContent=timeLabel(prefs.time);
  $$('#timeChips .chip').forEach(function(b){b.setAttribute('aria-pressed',String(Number(b.getAttribute('data-t'))===prefs.time));});
  $('#tMinus').disabled=prefs.time<=10;$('#tPlus').disabled=prefs.time>=600;
  renderHomeBest();
}
function renderHomeBest(){
  var k=condKey(prefs.mode,prefs.time),b=board(k,true),el=$('#homeBest');
  el.textContent='';
  if(!b.length){el.textContent=condLabel(k)+' 기록이 아직 없어요. 첫 1위에 도전해 보세요!';return;}
  el.appendChild(document.createTextNode(condLabel(k)+' 1위 '));
  el.appendChild(nickEl(b[0].nick));
  el.appendChild(document.createTextNode(' '+b[0].ok+'개 (틀림 '+b[0].no+')'));
}

/* ---------- 게임 ---------- */
var G=null,gid=0;
var TIME_SCALE=1.1; /* 타이머 1초 = 실제 1.1초 (시간이 10% 느리게 흐름) */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function refill(){
  var dans=G.mode==='random'?DANS:[G.mode],pairs=[];
  dans.forEach(function(a){for(var b=1;b<=9;b++)pairs.push([a,b]);});
  shuffle(pairs);
  var n=pairs.length-1;
  if(G.last&&n>0&&pairs[n][0]===G.last[0]&&pairs[n][1]===G.last[1]){var t=pairs[n];pairs[n]=pairs[0];pairs[0]=t;}
  G.bag=pairs;
}
function nextQuestion(){
  if(!G.bag.length)refill();
  G.q=G.bag.pop();G.last=G.q;G.input='';
  $('#qa').textContent=G.q[0];$('#qb').textContent=G.q[1];
  var q=$('#q');q.classList.remove('new');void q.offsetWidth;q.classList.add('new');
  clearMark();$('#fb').textContent='';setInput('');
}
function setInput(s){
  $$('#cells .cell').forEach(function(c,i){
    c.textContent=s.charAt(i)||'';
    c.classList.toggle('cur',i===s.length);
  });
}
function showMark(kind){var m=$('#mark');m.setAttribute('data-kind',kind);m.classList.remove('on');void m.getBoundingClientRect();m.classList.add('on');}
function clearMark(){var m=$('#mark');m.classList.remove('on');m.setAttribute('data-kind','');}
function updateScore(){$('#cOk').textContent=G.ok;$('#cNo').textContent=G.no;}
function setTimer(frac,sec){$('#pencil').style.setProperty('--p',Math.max(0,Math.min(1,frac)).toFixed(4));$('#timeText').textContent=clock(sec);}

function startGame(){
  var input=$('#nick'),nick=input.value.trim().replace(/\s+/g,' ');
  if(!nick){
    $('#nickErr').textContent='닉네임을 먼저 써 주세요!';
    input.classList.remove('bad');void input.offsetWidth;input.classList.add('bad');
    try{input.focus();}catch(e){}
    if(current!=='home'){renderHome();show('home');}
    return;
  }
  prefs.nick=nick;
  prefs.recent=[nick].concat(prefs.recent.filter(function(n){return n!==nick;})).slice(0,6);
  savePrefs();
  audio();
  if(G&&G.raf)cancelAnimationFrame(G.raf);
  G={id:++gid,nick:nick,mode:prefs.mode,time:prefs.time,ok:0,no:0,log:[],bag:[],last:null,q:null,input:'',
     running:false,locked:true,paused:false,endAt:0,pauseAt:0,raf:0,lastSec:null};
  $('#gNick').textContent=nick;$('#gMode').textContent=modeLabel(G.mode);
  $('#qa').textContent='?';$('#qb').textContent='?';
  $('#cells').classList.remove('live');
  setInput('');updateScore();clearMark();$('#fb').textContent='';
  setTimer(1,G.time);$('#game').classList.remove('hurry');
  show('game');
  countdown(G.id);
}
function overlayText(txt,cls){
  var ov=$('#overlay'),t=$('#ovText');
  ov.hidden=false;t.textContent=txt;t.className='ov-text'+(cls?' '+cls:'');
  void t.offsetWidth;t.classList.add('pop');
}
function countdown(id){
  var steps=['3','2','1','시작!'],i=0;
  (function step(){
    if(!G||G.id!==id||current!=='game'){$('#overlay').hidden=true;return;}
    if(i<steps.length){
      overlayText(steps[i],i===3?'go':'');sfx.count(i===3);i++;
      setTimeout(step,i===4?560:720);
    }else{$('#overlay').hidden=true;begin();}
  })();
}
function begin(){
  G.running=true;G.locked=false;G.endAt=performance.now()+G.time*1000*TIME_SCALE;
  $('#cells').classList.add('live');
  nextQuestion();loop();
}
function loop(){
  if(!G||!G.running||G.paused)return;
  var left=Math.max(0,G.endAt-performance.now()),sec=Math.ceil(left/(1000*TIME_SCALE));
  setTimer(left/(G.time*1000*TIME_SCALE),sec);
  if(sec!==G.lastSec){
    if(G.lastSec!==null&&sec>0&&sec<=5)sfx.tick();
    G.lastSec=sec;$('#game').classList.toggle('hurry',sec<=10&&G.time>10);
  }
  if(left<=0){finish();return;}
  G.raf=requestAnimationFrame(loop);
}
function canType(){return G&&G.running&&!G.locked&&!G.paused;}
function press(d){
  if(!canType())return;
  if(G.input.length>=2){nudge();return;}
  if(G.input==='0')G.input='';
  G.input+=d;setInput(G.input);
}
function back(){if(!canType())return;G.input=G.input.slice(0,-1);setInput(G.input);}
function nudge(){var c=$('#cells');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function submit(){
  if(!canType())return;
  if(G.input===''){nudge();return;}
  var a=G.q[0],b=G.q[1],ans=a*b,val=parseInt(G.input,10),id=G.id;
  G.locked=true;$('#cells').classList.remove('live');
  if(val===ans){
    G.ok++;G.log.push({a:a,b:b,val:val,ok:true});
    sfx.ding();showMark('ok');$('#fb').textContent='딩동! 정답이에요';
  }else{
    G.no++;G.log.push({a:a,b:b,val:val,ok:false});
    sfx.beep();buzz(160);showMark('no');$('#fb').textContent='삐! '+a+' × '+b+' = '+ans;
  }
  updateScore();
  setTimeout(function(){
    if(!G||G.id!==id||!G.running)return;
    G.locked=false;$('#cells').classList.add('live');nextQuestion();
  },val===ans?220:1150);
}
function pause(){if(!G||!G.running||G.paused)return;G.paused=true;G.pauseAt=performance.now();cancelAnimationFrame(G.raf);}
function resume(){if(!G||!G.running||!G.paused)return;G.endAt+=performance.now()-G.pauseAt;G.paused=false;loop();}
function finish(){
  var g=G;g.running=false;g.locked=true;cancelAnimationFrame(g.raf);setTimer(0,0);
  $('#cells').classList.remove('live');
  sfx.end();
  var rec=null;
  if(g.ok+g.no>0){
    rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),nick:g.nick,mode:g.mode,time:g.time,ok:g.ok,no:g.no,at:Date.now()};
    records.push(rec);
    if(records.length>MAX_REC)records=records.slice(-MAX_REC);
    saveRecords();
  }
  prefs.lastCond=condKey(g.mode,g.time);savePrefs();
  overlayText('시간 끝!','end');
  setTimeout(function(){if(G!==g)return;$('#overlay').hidden=true;showResult(g,rec);},1200);
}
function exitGame(){
  if(!G||current!=='game')return;
  if(!G.running){G=null;renderHome();show('home');return;}
  pause();
  ask('게임을 그만할까요?','지금 그만두면 이번 기록은 순위에 남지 않아요.','그만하기','계속하기').then(function(yes){
    if(!G)return;
    if(yes){G.running=false;cancelAnimationFrame(G.raf);G=null;renderHome();show('home');}
    else resume();
  });
}

/* ---------- 결과 ---------- */
function showResult(g,rec){
  var total=g.ok+g.no,acc=total?Math.round(g.ok/total*100):0,k=condKey(g.mode,g.time);
  $('#rNick').textContent=g.nick;$('#rCond').textContent=condLabel(k);
  $('#rOk').textContent=g.ok;$('#rNo').textContent=g.no+'개';$('#rAcc').textContent=acc+'%';
  var stamp=total===0||acc<70?'조금 더 힘내요':acc>=90?'참 잘했어요':'잘했어요';
  $('#rStampText').textContent=stamp;
  var st=$('#rStamp');st.classList.toggle('small-text',stamp.length>5);st.classList.remove('in');void st.offsetWidth;st.classList.add('in');

  var note='';
  if(rec){
    var b=board(k,true),pl=places(b),idx=-1;
    for(var i=0;i<b.length;i++){if(b[i].nick===g.nick){idx=i;break;}}
    $('#rRank').textContent=idx>=0?pl[idx]+'위/'+b.length+'명':'-';
    var mine=records.filter(function(r){return r.nick===g.nick&&condOf(r)===k&&r.id!==rec.id;}).sort(better);
    if(!mine.length)note='첫 기록이에요! 다음엔 더 많이 맞혀 봐요.';
    else if(better(rec,mine[0])<0)note='최고 기록 갱신! (전에는 '+mine[0].ok+'개)';
    else note='내 최고 기록은 '+mine[0].ok+'개예요.';
    note+='\n한 문제에 평균 '+(g.time/total).toFixed(1)+'초 걸렸어요.';
  }else{
    $('#rRank').textContent='-';
    note='문제를 하나도 풀지 않아서 순위에 기록되지 않았어요.';
  }
  $('#rNote').textContent=note;

  var list=$('#rWrong'),seen={},wrong=g.log.filter(function(x){if(x.ok)return false;var key=x.a+'x'+x.b;if(seen[key])return false;seen[key]=1;return true;});
  list.textContent='';
  $('#rWrongWrap').hidden=total===0;
  if(total>0&&!wrong.length){
    var li=document.createElement('li');li.className='pen-note';li.style.border='0';li.style.background='none';li.style.padding='0';
    li.textContent='틀린 문제가 하나도 없어요!';list.appendChild(li);
  }
  wrong.forEach(function(x){
    var li=document.createElement('li');li.textContent=x.a+' × '+x.b+' = '+(x.a*x.b);
    var s=document.createElement('small');s.textContent='내 답 '+x.val;li.appendChild(s);list.appendChild(li);
  });
  show('result');
}

/* ---------- 순위 ---------- */
var rankCond=null;
function condSort(a,b){
  var A=parseCond(a),B=parseCond(b);
  var oa=A.mode==='random'?0:A.mode,ob=B.mode==='random'?0:B.mode;
  return (oa-ob)||(A.time-B.time);
}
function openRank(from,cond){
  rankFrom=from||current;
  var conds=uniqueConds();
  rankCond=cond&&conds.indexOf(cond)>=0?cond:(prefs.lastCond&&conds.indexOf(prefs.lastCond)>=0?prefs.lastCond:(conds[0]||null));
  renderRank();show('rank');
}
function uniqueConds(){
  var m={};records.forEach(function(r){m[condOf(r)]=(m[condOf(r)]||0)+1;});
  return Object.keys(m).sort(condSort);
}
function renderRank(){
  var conds=uniqueConds(),box=$('#conds'),ol=$('#board');
  box.textContent='';ol.textContent='';
  $('#bestOnly').checked=!!prefs.bestOnly;
  $('#clearBtn').hidden=!records.length;
  conds.forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=condLabel(k);
    b.setAttribute('aria-pressed',String(k===rankCond));
    b.addEventListener('click',function(){rankCond=k;renderRank();});
    box.appendChild(b);
  });
  if(!rankCond){
    var e=document.createElement('li');e.className='empty';
    var p=document.createElement('p');p.textContent='아직 기록이 없어요.\n첫 번째 주인공이 되어 보세요!';p.style.whiteSpace='pre-line';
    var go=document.createElement('button');go.type='button';go.className='btn primary';go.textContent='게임 하러 가기';
    go.addEventListener('click',function(){renderHome();show('home');});
    e.appendChild(p);e.appendChild(go);ol.appendChild(e);return;
  }
  var list=board(rankCond,prefs.bestOnly),pl=places(list),me=prefs.nick;
  list.forEach(function(r,i){
    var li=document.createElement('li');li.className='row'+(r.nick===me?' me':'');
    var md=document.createElement('span');md.className='medal'+(pl[i]<=3?' m'+pl[i]:'');md.textContent=pl[i];
    var who=document.createElement('span');who.className='who';who.appendChild(nickEl(r.nick));
    var sm=document.createElement('small');var tot=r.ok+r.no;
    sm.textContent='틀림 '+r.no+' · 정확도 '+(tot?Math.round(r.ok/tot*100):0)+'% · '+dateLabel(r.at);who.appendChild(sm);
    var pts=document.createElement('span');pts.className='pts';pts.textContent=r.ok;
    var u=document.createElement('span');u.textContent='개';pts.appendChild(u);
    li.appendChild(md);li.appendChild(who);li.appendChild(pts);ol.appendChild(li);
  });
  var on=box.querySelector('[aria-pressed="true"]');
  if(on&&on.scrollIntoView){try{on.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}}
}

/* ---------- 확인 창 ---------- */
var modalResolve=null;
function ask(title,text,yes,no){
  $('#mTitle').textContent=title;$('#mText').textContent=text;$('#mYes').textContent=yes;$('#mNo').textContent=no;
  $('#modal').hidden=false;
  try{$('#mNo').focus();}catch(e){}
  return new Promise(function(res){modalResolve=res;});
}
function closeModal(v){
  if($('#modal').hidden)return;
  $('#modal').hidden=true;var r=modalResolve;modalResolve=null;if(r)r(v);
}

/* ---------- 이벤트 ---------- */
function flashKey(k){
  var b=$('#keypad [data-k="'+k+'"]');if(!b)return;
  b.classList.add('pressed');setTimeout(function(){b.classList.remove('pressed');},110);
}
function bind(){
  $$('.snd').forEach(function(b){b.addEventListener('click',function(){prefs.muted=!prefs.muted;savePrefs();renderSound();if(!prefs.muted){audio();sfx.count(false);}});});
  $('#nick').addEventListener('input',function(){$('#nickErr').textContent='';this.classList.remove('bad');renderRecent();});
  $('#nick').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();startGame();}});
  $$('#danGrid .choice').forEach(function(b){b.addEventListener('click',function(){
    var v=b.getAttribute('data-v');prefs.mode=v==='random'?'random':Number(v);savePrefs();renderDan();
  });});
  $$('#timeChips .chip').forEach(function(b){b.addEventListener('click',function(){prefs.time=clampTime(b.getAttribute('data-t'));savePrefs();renderTime();});});
  $('#tMinus').addEventListener('click',function(){prefs.time=clampTime(prefs.time-10);savePrefs();renderTime();});
  $('#tPlus').addEventListener('click',function(){prefs.time=clampTime(prefs.time+10);savePrefs();renderTime();});
  $('#startBtn').addEventListener('click',startGame);
  $('#toRank').addEventListener('click',function(){openRank('home',condKey(prefs.mode,prefs.time));});
  $('#keypad').addEventListener('click',function(e){
    var b=e.target.closest('.key');if(!b)return;
    var k=b.getAttribute('data-k');audio();
    if(k==='ok')submit();else if(k==='back')back();else press(k);
  });
  $('#exitBtn').addEventListener('click',exitGame);
  $('#againBtn').addEventListener('click',startGame);
  $('#homeBtn').addEventListener('click',function(){G=null;renderHome();show('home');});
  $('#rankBtn2').addEventListener('click',function(){openRank('result',G?condKey(G.mode,G.time):null);});
  $('#rankBack').addEventListener('click',function(){if(rankFrom==='result'&&G){show('result');}else{renderHome();show('home');}});
  $('#bestOnly').addEventListener('change',function(){prefs.bestOnly=this.checked;savePrefs();renderRank();});
  $('#clearBtn').addEventListener('click',function(){
    ask('기록을 모두 지울까요?','이 기기에 저장된 모든 순위 기록이 지워지고 되돌릴 수 없어요.','모두 지우기','취소').then(function(yes){
      if(!yes)return;records=[];saveRecords();rankCond=null;renderRank();
    });
  });
  $('#mYes').addEventListener('click',function(){closeModal(true);});
  $('#mNo').addEventListener('click',function(){closeModal(false);});
  $('#modal').addEventListener('click',function(e){if(e.target===this)closeModal(false);});

  document.addEventListener('keydown',function(e){
    if(!$('#modal').hidden){if(e.key==='Escape'){e.preventDefault();closeModal(false);}return;}
    if(current!=='game'||e.ctrlKey||e.metaKey||e.altKey)return;
    if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);flashKey(e.key);}
    else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();back();flashKey('back');}
    else if(e.key==='Enter'){e.preventDefault();submit();flashKey('ok');}
    else if(e.key==='Escape'){e.preventDefault();exitGame();}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden)pause();else if(G&&G.paused&&$('#modal').hidden)resume();});

  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('#installBtn').hidden=false;});
  window.addEventListener('appinstalled',function(){$('#installBtn').hidden=true;});
  $('#installBtn').addEventListener('click',function(){
    if(!deferred)return;deferred.prompt();
    var p=deferred.userChoice;deferred=null;$('#installBtn').hidden=true;if(p&&p.catch)p.catch(function(){});
  });
}

function registerSW(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  /* 설치한 앱을 오래 백그라운드에 뒀다가 다시 열면, 첫 화면일 때만 새로고침해서 최신 버전을 받음 */
  var hiddenAt=0;
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){hiddenAt=Date.now();return;}
    if(hiddenAt&&Date.now()-hiddenAt>=10*60*1000&&current==='home'&&$('#modal').hidden)location.reload();
  });
}

function boot(data){
  loadData(data||{});
  renderSound();renderHome();bind();show('home');registerSW();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(function(){return {prefs:prefs,records:records};});}catch(e){}}
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
